<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>原神选号系统</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
font-family:"Microsoft YaHei";
color:white;
}

/* 顶部 */

.top{
height:90px;
background:#111827;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
color:#ffd166;
}

/* 服务器 */

.serverBox{
display:flex;
justify-content:center;
gap:20px;
padding:30px;
flex-wrap:wrap;
}

.serverBtn{
padding:15px 35px;
border:none;
border-radius:14px;
font-size:22px;
cursor:pointer;
background:#1e293b;
color:white;
transition:.3s;
}

.serverBtn:hover{
background:#2563eb;
}

.active{
background:#2563eb;
}

/* 区域 */

.area{
padding:30px;
}

.title{
font-size:30px;
margin-bottom:20px;
color:#7dd3fc;
}

/* 网格 */

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(130px,1fr));
gap:16px;
}

.item{
background:#1e293b;
padding:16px;
border-radius:14px;
text-align:center;
cursor:pointer;
transition:.3s;
border:2px solid transparent;
}

.item:hover{
transform:scale(1.05);
}

.selected{
border:2px solid #00ff88;
background:#2563eb;
}

/* 搜索按钮 */

.searchBtn{
display:block;
margin:40px auto;
padding:18px 60px;
font-size:28px;
border:none;
border-radius:18px;
cursor:pointer;
background:linear-gradient(
45deg,
#2563eb,
#7c3aed
);
color:white;
}

/* 搜索结果 */

.resultArea{
padding:30px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(360px,1fr));
gap:25px;
}

.card{
background:#1e293b;
border-radius:22px;
overflow:hidden;
}

.cardTop{
padding:20px;
background:linear-gradient(
45deg,
#2563eb,
#7c3aed
);
}

.code{
font-size:28px;
font-weight:bold;
}

.uid{
margin-top:10px;
font-size:18px;
}

.info{
padding:20px;
line-height:2;
}

.role{
background:#0f172a;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.weapon{
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
color:#ffd166;
}

.server{
color:#00ff88;
font-size:20px;
margin-bottom:10px;
}

.level{
font-size:22px;
color:#7dd3fc;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="top">

原神选号系统

</div>

<!-- 服务器 -->

<div class="serverBox">

<button class="serverBtn active"
onclick="changeServer(this,'亚服')">

亚服

</button>

<button class="serverBtn"
onclick="changeServer(this,'欧服')">

欧服

</button>

<button class="serverBtn"
onclick="changeServer(this,'美服')">

美服

</button>

<button class="serverBtn"
onclick="changeServer(this,'港澳台服')">

港澳台服

</button>

</div>

<!-- 角色 -->

<div class="area">

<div class="title">

选择角色

</div>

<div class="grid"
id="roleGrid">

</div>

</div>

<!-- 武器 -->

<div class="area">

<div class="title">

选择武器

</div>

<div class="grid"
id="weaponGrid">

</div>

</div>

<!-- 搜索 -->

<button class="searchBtn"
onclick="searchAccount()">

搜索账号

</button>

<!-- 结果 -->

<div class="resultArea"
id="resultArea">

</div>

/* 渲染角色 */

const roleGrid =
document.getElementById(
"roleGrid"
);

roles.forEach(role=>{

roleGrid.innerHTML += `

<div class="item"
onclick="selectItem(this,'${role}')">

${role}

</div>

`;

});

/* 渲染武器 */

const weaponGrid =
document.getElementById(
"weaponGrid"
);

weapons.forEach(weapon=>{

weaponGrid.innerHTML += `

<div class="item"
onclick="selectItem(this,'${weapon}')">

${weapon}

</div>

`;

});

/* 选择 */

let selected = [];

function selectItem(el,name){

el.classList.toggle(
"selected"
);

if(selected.includes(name)){

selected =
selected.filter(
i=>i!==name
);

}else{

selected.push(name);

}

}

/* 模拟账号数据库 */

const accounts = [

{

server:"亚服",

code:"A001",

uid:"865432178",

level:"60",

roles:[

"甘雨(1命)",

],

/* 搜索 */

function searchAccount(){

const resultArea =
document.getElementById(
"resultArea"
);

resultArea.innerHTML = "";

/* 搜索 */

const result =
accounts.filter(acc=>{

if(acc.server !== currentServer){

return false;

}

for(let item of selected){

const hasRole =
acc.roles.some(
r=>r.includes(item)
);

const hasWeapon =
acc.weapons.includes(item);

if(!hasRole &&
!hasWeapon){

return false;

}

}

return true;

});

/* 无结果 */

if(result.length===0){

resultArea.innerHTML = `

<div style="
font-size:30px;
padding:50px;
">

未找到相关账号

</div>

`;

return;

}

/* 显示 */

result.forEach(acc=>{

let roleHTML = "";

acc.roles.forEach(r=>{

roleHTML += `

<div class="role">

${r}

</div>

`;

});

let weaponHTML = "";

acc.weapons.forEach(w=>{

weaponHTML += `

<div class="weapon">

${w}

</div>

`;

});

resultArea.innerHTML += `

<div class="card">

<div class="cardTop">

<div class="code">

</div>

<div class="uid">

</div>

${acc.server}

${acc.level}

margin-top:20px;
">

</h3>

${weaponHTML}

</div>

`;

});

}
