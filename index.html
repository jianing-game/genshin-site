/* 选择 */

let selected = [];

function selectItem(el,name){

el.classList.toggle(
"selected"
);

if(selected.includes(name)){

selected =
selected.filter(
i=>i!==name
);

}else{

selected.push(name);

}

}

document.getElementById(
"resultArea"
);

const result =
accounts.filter(acc=>{

if(acc.server !== currentServer){

}

for(let item of selected){

const hasRole =
acc.roles.some(
r=>r.includes(item)
);

acc.weapons.includes(item);

if(!hasRole &&
!hasWeapon){

}

}

return true;

resultArea.innerHTML = `

font-size:30px;
padding:50px;

</div>

`;

acc.roles.forEach(r=>{

roleHTML += `

${r}

</div>

`;

});

let weaponHTML = "";

acc.weapons.forEach(w=>{

</div>
