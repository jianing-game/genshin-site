<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>原神选号系统</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
font-family:"Microsoft YaHei";
color:white;
}

/* 顶部 */

.top{
padding:25px;
background:#111827;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.topTitle{
font-size:42px;
font-weight:bold;
color:#ffd166;
}

.shopName{
margin-top:10px;
font-size:20px;
color:white;
}

/* 服务器 */

.serverBox{
display:flex;
justify-content:center;
gap:20px;
padding:30px;
flex-wrap:wrap;
}

.serverBtn{
padding:15px 35px;
border:none;
border-radius:14px;
font-size:22px;
cursor:pointer;
background:#1e293b;
color:white;
transition:.3s;
}

.serverBtn:hover{
background:#2563eb;
}

.active{
background:#2563eb;
}

/* 区域 */

.area{
padding:30px;
}

.title{
font-size:30px;
margin-bottom:20px;
color:#7dd3fc;
}

/* 网格 */

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(130px,1fr));
gap:16px;
}

.item{
background:#1e293b;
padding:16px;
border-radius:14px;
text-align:center;
cursor:pointer;
transition:.3s;
border:2px solid transparent;
}

.item:hover{
transform:scale(1.05);
}

.selected{
border:2px solid #00ff88;
background:#2563eb;
}

/* 按钮区域 */

.btnBox{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

/* 搜索按钮 */

.searchBtn{
display:block;
margin:40px 0;
padding:18px 60px;
font-size:28px;
border:none;
border-radius:18px;
cursor:pointer;
background:linear-gradient(
45deg,
#2563eb,
#7c3aed
);
color:white;
}

/* 搜索结果 */

.resultArea{
padding:30px;
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(360px,1fr));
gap:25px;
}

.card{
background:#1e293b;
border-radius:22px;
overflow:hidden;
}

.cardTop{
padding:20px;
background:linear-gradient(
45deg,
#2563eb,
#7c3aed
);
}

.code{
font-size:28px;
font-weight:bold;
}

.uid{
margin-top:10px;
font-size:18px;
}

.info{
padding:20px;
line-height:2;
}

/* 角色 */

.role{
background:#0f172a;
padding:12px;
border-radius:12px;
margin-bottom:12px;
position:relative;
font-size:18px;
}

/* 命座角标 */

.mingzuo{
position:absolute;
top:8px;
right:10px;
background:#2563eb;
color:white;
width:28px;
height:28px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:16px;
font-weight:bold;
}

/* 武器 */

.weapon{
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
color:#ffd166;
}

.server{
color:#00ff88;
font-size:20px;
margin-bottom:10px;
}

.level{
font-size:22px;
color:#7dd3fc;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="top">

<div>

<div class="topTitle">

原神选号系统

</div>

<div class="shopName">

佳宁手游

</div>

</div>

</div>

<!-- 服务器 -->

<div class="serverBox">

<button class="serverBtn active"
onclick="changeServer(this,'亚服')">

亚服

</button>

<button class="serverBtn"
onclick="changeServer(this,'欧服')">

欧服

</button>

<button class="serverBtn"
onclick="changeServer(this,'美服')">

美服

</button>

<button class="serverBtn"
onclick="changeServer(this,'港澳台服')">

港澳台服

</button>

</div>

<!-- 角色 -->

<div class="area">

<div class="title">

选择角色

</div>

<div class="grid"
id="roleGrid">

</div>

</div>

<!-- 武器 -->

<div class="area">

<div class="title">

选择武器

</div>

<div class="grid"
id="weaponGrid">

</div>

</div>

<!-- 按钮 -->

<div class="btnBox">

<button class="searchBtn"
onclick="searchAccount()">

搜索账号

</button>

<button class="searchBtn"
onclick="clearSelect()"
style="
background:linear-gradient(
45deg,
#dc2626,
#ef4444
);
">

一键清空

</button>

</div>

<!-- 结果 -->

<div class="resultArea"
id="resultArea">

</div>

<script>

/* 当前服务器 */

let currentServer = "亚服";

/* 切换服务器 */

function changeServer(btn,server){

document
.querySelectorAll(".serverBtn")
.forEach(b=>{

b.classList.remove("active");

});

btn.classList.add("active");

currentServer = server;

}

/* 全角色 */

const roles = [

"温迪",
"魈",
"枫原万叶",
"流浪者",
"闲云",
"恰斯卡",
"法尔伽",
"琴",
"钟离",
"阿贝多",
"荒泷一斗",
"娜维娅",
"千织",
"希诺宁",
"雷电将军",
"八重神子",
"赛诺",
"克洛琳德",
"刻晴",
"菲林斯",
"纳西妲",
"艾尔海森",
"白术",
"艾梅莉埃",
"基尼奇",
"菈乌玛",
"提纳里",
"达达利亚",
"珊瑚宫心海",
"神里绫人",
"夜兰",
"妮露",
"那维莱特",
"芙宁娜",
"希格雯",
"玛拉妮",
"奈芙尔",
"莫娜",
"可莉",
"胡桃",
"宵宫",
"林尼",
"迪希雅",
"阿蕾奇诺",
"玛薇卡",
"尼克",
"迪卢克",
"甘雨",
"优菈",
"神里绫华",
"申鹤",
"莱欧斯利",
"茜特菈莉",
"爱可菲",
"丝柯克",
"七七"

];

/* 全武器 */

const weapons = [

"斫峰之刃",
"磐岩结绿",
"雾切之回光",
"波乱月白经津",
"圣显之钥",
"裁叶萃光",
"静水流涌之辉",
"有乐御簾切",
"苍古自由之誓",
"岩峰巡歌",
"苍耀",
"黑蚀",
"峰刃白铁",
"息燧之笛",
"松籁响起之时",
"赤角石溃杵",
"苇海信标",
"山王长牙",
"焚曜千阳",
"苇海巨斧",
"赦罪巨剑",
"贯虹之朔",
"护摩之杖",
"薙草之稻光",
"息灾",
"赤沙之杖",
"柔灯挽歌",
"香韵奏者",
"镇山之钉",
"尘世之锁",
"赤月之形",
"不灭月华",
"神乐之真意",
"千夜浮梦",
"图莱杜拉的回忆",
"碧落之珑",
"金流监督",
"万世流涌大典",
"冲浪时光",
"鹤鸣余音",
"祭星者之望",
"终末嗟叹之诗",
"飞雷之弦振",
"冬极白星",
"若水",
"猎人之径",
"最初的大魔术",
"白雨心弦",
"星鹫赤羽"

];

/* 渲染角色 */

const roleGrid =
document.getElementById(
"roleGrid"
);

roles.forEach(role=>{

roleGrid.innerHTML += `

<div class="item"
onclick="selectItem(this,'${role}')">

${role}

</div>

`;

});

/* 渲染武器 */

const weaponGrid =
document.getElementById(
"weaponGrid"
);

weapons.forEach(weapon=>{

weaponGrid.innerHTML += `

<div class="item"
onclick="selectItem(this,'${weapon}')">

${weapon}

</div>

`;

});

/* 选择 */

let selected = [];

function selectItem(el,name){

el.classList.toggle(
"selected"
);

if(selected.includes(name)){

selected =
selected.filter(
i=>i!==name
);

}else{

selected.push(name);

}

}

/* 模拟账号数据库 */

const accounts = [

{

server:"亚服",

code:"0001",

uid:"",

level:"50",

roles:[

"菲林斯(1命)",
"林尼",
"七七",
"迪卢克",
"梦见月瑞希"

],

weapons:[

"狼的末路"

]

}

];

/* 搜索 */

function searchAccount(){

const resultArea =
document.getElementById(
"resultArea"
);

resultArea.innerHTML = "";

/* 搜索 */

const result =
accounts.filter(acc=>{

if(acc.server !== currentServer){

return false;

}

for(let item of selected){

const hasRole =
acc.roles.some(
r=>r.includes(item)
);

const hasWeapon =
acc.weapons.includes(item);

if(!hasRole &&
!hasWeapon){

return false;

}

}

return true;

});

/* 无结果 */

if(result.length===0){

resultArea.innerHTML = `

<div style="
font-size:30px;
padding:50px;
">

未找到相关账号

</div>

`;

return;

}

/* 显示 */

result.forEach(acc=>{

let roleHTML = "";

/* 角色 */

acc.roles.forEach(r=>{

let mingzuo = "";

let roleName = r;

const match =
r.match(/([0-6])命/);

if(match){

mingzuo = match[1];

roleName =
r.replace(/\([0-6]命\)/,"");

}

roleHTML += `

<div class="role">

${roleName}

${mingzuo ?
`<div class="mingzuo">${mingzuo}</div>`
: ""}

</div>

`;

});

/* 武器 */

let weaponHTML = "";

acc.weapons.forEach(w=>{

weaponHTML += `

<div class="weapon">

${w}

</div>

`;

});

/* 卡片 */

resultArea.innerHTML += `

<div class="card">

<div class="cardTop">

<div class="code">

编号：${acc.code}

</div>

<div class="uid">

UID：隐藏

</div>

</div>

<div class="info">

<div class="server">

服务器：
${acc.server}

</div>

<div class="level">

冒险等级：
${acc.level}

</div>

<h3>

角色信息

</h3>

${roleHTML}

<h3 style="
margin-top:20px;
">

武器信息

</h3>

${weaponHTML}

</div>

</div>

`;

});

}

/* 一键清空 */

function clearSelect(){

selected = [];

document
.querySelectorAll(".item")
.forEach(item=>{

item.classList.remove(
"selected"
);

});

document
.getElementById(
"resultArea"
).innerHTML = "";

}

</script>

</body>
</html>
